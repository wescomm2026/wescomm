<!doctype html>
<html lang="en-PH">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#006633" />
    <title>WESCOMM is offline</title>
    <style>
      :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background: linear-gradient(180deg, #f8fbf8, #eef7f0);
        color: #17211b;
      }
      main {
        width: min(100%, 460px);
        border: 1px solid #dce8de;
        border-radius: 24px;
        padding: 32px 28px;
        background: #fff;
        box-shadow: 0 20px 55px rgba(0, 91, 43, 0.1);
        text-align: center;
      }
      img { width: min(240px, 80%); height: auto; }
      .status {
        display: inline-flex;
        margin-top: 24px;
        border-radius: 999px;
        padding: 7px 12px;
        background: #fff2d8;
        color: #805600;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }
      h1 { margin: 14px 0 8px; font-size: clamp(24px, 7vw, 32px); }
      p { margin: 0; color: #5e6b63; font-size: 15px; line-height: 1.65; }
      button {
        width: 100%;
        margin-top: 24px;
        border: 0;
        border-radius: 12px;
        padding: 13px 18px;
        background: #006633;
        color: #fff;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }
      button:focus-visible { outline: 3px solid rgba(0, 102, 51, 0.3); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/wescomm-icon-512.png" alt="WESCOMM" />
      <div class="status">Offline</div>
      <h1>Internet connection required</h1>
      <p>
        WESCOMM keeps reservations, stock, receipts, and account information online so they stay current.
        Connect to the internet, then try again.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
