name: QA bug report
description: Report a reproducible problem found in WESCOMM staging.
title: "[QA] "
labels: [bug, qa]
body:
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - P0 - Security, data leak, negative stock, or outage
        - P1 - Login, checkout, role, or major workflow broken
        - P2 - Incorrect behavior with a workaround
        - P3 - Cosmetic or minor responsive issue
    validations:
      required: true

  - type: dropdown
    id: role
    attributes:
      label: User role
      options:
        - Guest
        - Student
        - Staff
        - Admin
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: "Example: Android 14, Chrome 128"
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: "https://wescomm-qa.vercel.app/student/shop"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Click...
        3. Enter...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Screenshot or recording
      description: Do not include passwords, OTPs, keys, or real student data.

  - type: input
    id: request_id
    attributes:
      label: Request ID
      description: Include the request ID if WESCOMM displayed one.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials and sensitive student information from this report.
          required: true
