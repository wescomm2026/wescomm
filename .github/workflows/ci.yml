name: WESCOMM CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wescomm_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wescomm_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wescomm_ci?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/wescomm_ci?schema=public
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Replay database migrations
        run: npm run prisma:migrate:deploy

      - name: Verify database migrations
        run: npm run prisma:migrate:verify:ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_ENV: development
      NEXT_PUBLIC_API_URL: /api/backend
      NEXT_PUBLIC_SUPABASE_URL: https://wescomm-ci.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: wescomm-ci-public-key
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: wescomm-ci-public-key
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check production configuration safeguards
        run: npm run test:config

      - name: Build
        run: npm run build
