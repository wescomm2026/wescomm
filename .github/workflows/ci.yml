name: WESCOMM CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wescomm_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wescomm_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wescomm_ci?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/wescomm_ci?schema=public
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify release migration safety
        run: npm run release:preflight

      - name: Bootstrap Supabase-compatible CI roles
        env:
          WESCOMM_BOOTSTRAP_CI_DATABASE_ROLES: I_CONFIRM_EPHEMERAL_WESCOMM_CI_DATABASE
        run: npm run prisma:bootstrap:ci

      - name: Replay database migrations
        run: npm run prisma:migrate:deploy

      - name: Verify database migrations
        run: npm run prisma:migrate:verify:ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        env:
          RUN_DATABASE_INTEGRATION_TESTS: "true"
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wescomm_ci?schema=public
          WESCOMM_RUN_ISOLATED_DB_TESTS: I_CONFIRM_LOCAL_WESCOMM_TEST_DATABASE
        run: npm test

      - name: Verify PayMongo database lifecycle
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wescomm_ci?schema=public
          WESCOMM_RUN_ISOLATED_DB_TESTS: I_CONFIRM_LOCAL_WESCOMM_TEST_DATABASE
        run: npm run test:paymongo:db

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_ENV: development
      NEXT_PUBLIC_API_URL: /api/backend
      NEXT_PUBLIC_SUPABASE_URL: https://wescomm-ci.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: wescomm-ci-public-key
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: wescomm-ci-public-key
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check production configuration safeguards
        run: npm run test:config

      - name: Build
        run: npm run build

      - name: Install release-test browser
        run: npx playwright install --with-deps chromium

      - name: Run release acceptance browser tests
        run: npm run test:e2e:release

      - name: Upload release browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-browser-diagnostics
          path: |
            frontend/playwright-report/release
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  release-gate:
    name: Release gate
    if: always()
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every release check
        shell: bash
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          set -euo pipefail
          if [[ "$BACKEND_RESULT" != "success" || "$FRONTEND_RESULT" != "success" ]]; then
            echo "::error::Release blocked: backend=${BACKEND_RESULT}, frontend=${FRONTEND_RESULT}."
            exit 1
          fi
          echo "Release gate passed."
