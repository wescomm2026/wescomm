name: Deploy protected WESCOMM staging

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_STAGING to run migrations and deploy the staging branch
        required: true
        type: string

permissions:
  contents: read
  checks: read

concurrency:
  group: wescomm-staging-release
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Migrate, deploy, and verify Staging
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: staging
    env:
      VERCEL_CLI_VERSION: 62.1.0
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      STAGING_DOMAIN: ${{ vars.STAGING_DOMAIN }}
      STAGING_PROTECTION_BYPASS_SECRET: ${{ secrets.STAGING_PROTECTION_BYPASS_SECRET }}
      DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}

    steps:
      - name: Require the staging branch and exact confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "staging" || "$DEPLOY_CONFIRMATION" != "DEPLOY_STAGING" ]]; then
            echo "::error::Run this workflow from the staging branch and enter DEPLOY_STAGING."
            exit 1
          fi

      - name: Check out the selected staging commit
        uses: actions/checkout@v4

      - name: Require the successful release gate for this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          successful_gate="$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
            --jq '[.check_runs[] | select(.name == "Release gate" and .conclusion == "success")] | length')"
          if [[ "$successful_gate" -lt 1 ]]; then
            echo "::error::The selected staging commit does not have a successful Release gate check."
            exit 1
          fi

      - name: Validate required deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$STAGING_DOMAIN"
          if [[ "$STAGING_DOMAIN" == "wescomm.store" || "$STAGING_DOMAIN" == "www.wescomm.store" ]]; then
            echo "::error::STAGING_DOMAIN must not be a Production domain."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Pull branch-scoped Vercel Preview settings
        run: >-
          npx --yes vercel@${VERCEL_CLI_VERSION} pull
          --yes
          --environment=preview
          --git-branch=staging
          --token="$VERCEL_TOKEN"

      - name: Verify the isolated Staging runtime configuration
        run: >-
          npx --yes vercel@${VERCEL_CLI_VERSION} env run
          --environment=preview
          --git-branch=staging
          --token="$VERCEL_TOKEN"
          -- npm --prefix backend run staging:verify

      - name: Verify migration safety
        run: >-
          npx --yes vercel@${VERCEL_CLI_VERSION} env run
          --environment=preview
          --git-branch=staging
          --token="$VERCEL_TOKEN"
          -- npm --prefix backend run release:preflight

      - name: Apply and verify Staging migrations
        run: >-
          npx --yes vercel@${VERCEL_CLI_VERSION} env run
          --environment=preview
          --git-branch=staging
          --token="$VERCEL_TOKEN"
          -- sh -c 'npm --prefix backend run prisma:migrate:deploy && npm --prefix backend run prisma:migrate:verify'

      - name: Build the exact selected commit with Staging variables
        run: npx --yes vercel@${VERCEL_CLI_VERSION} build --token="$VERCEL_TOKEN"

      - name: Deploy the prebuilt Staging application
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(npx --yes vercel@${VERCEL_CLI_VERSION} deploy --prebuilt --token="$VERCEL_TOKEN")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Point the stable Staging domain to the deployment
        run: >-
          npx --yes vercel@${VERCEL_CLI_VERSION} alias set
          "${{ steps.deploy.outputs.url }}"
          "$STAGING_DOMAIN"
          --token="$VERCEL_TOKEN"

      - name: Wait for Staging readiness
        shell: bash
        run: |
          set -euo pipefail
          health_url="https://${STAGING_DOMAIN}/api/health/ready"
          curl_args=(--fail --silent --show-error --max-time 20)
          if [[ -n "$STAGING_PROTECTION_BYPASS_SECRET" ]]; then
            curl_args+=(--header "x-vercel-protection-bypass: ${STAGING_PROTECTION_BYPASS_SECRET}")
          fi
          for attempt in $(seq 1 30); do
            if curl "${curl_args[@]}" "$health_url" > /tmp/wescomm-staging-health.json; then
              node -e '
                const fs = require("node:fs");
                const payload = JSON.parse(fs.readFileSync("/tmp/wescomm-staging-health.json", "utf8"));
                if (payload.status !== "ready") process.exit(1);
              '
              exit 0
            fi
            sleep 10
          done
          echo "::error::Staging did not become ready within five minutes."
          exit 1

      - name: Publish deployment summary
        shell: bash
        run: |
          {
            echo "## Staging deploy result"
            echo "- URL: https://${STAGING_DOMAIN}"
            echo "- Deployment: ${{ steps.deploy.outputs.url }}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Migration verification: passed"
            echo "- Readiness check: passed"
          } >> "$GITHUB_STEP_SUMMARY"
